[package]
name = "traderbar"
version = "0.1.0"
description = "macOS menu bar stock monitor for VibeTrader"
authors = ["feilaoda"]
edition = "2021"

[lib]
name = "traderbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.5.6", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-positioner = { version = "2.3.0", features = ["tray-icon"] }
